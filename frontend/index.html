<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NetPulse – Monitor de rede</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%231fd68a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#eaf0fb;--pn:#fff;--pn2:#f1f5fd;--ln:#cdd7ee;--tx:#0f1b3d;--mu:#5d6c96;--up:#0fa876;--dn:#e0304f;--wn:#d98a14;--ac:#1a7fe0;--grid:#cdd7ee;--glow:.25;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d1c;--pn:#0d1630;--pn2:#121d3d;--ln:#22305e;--tx:#e6ecff;--mu:#8493c4;--up:#2ee6a6;--dn:#ff4d6d;--wn:#ffb454;--ac:#4cc9ff;--grid:#16224a;--glow:.7;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070d1c;--pn:#0d1630;--pn2:#121d3d;--ln:#22305e;--tx:#e6ecff;--mu:#8493c4;--up:#2ee6a6;--dn:#ff4d6d;--wn:#ffb454;--ac:#4cc9ff;--grid:#16224a;--glow:.7;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 Sora,system-ui,sans-serif}
.app{display:grid;grid-template-columns:1fr 370px;height:100%}
.map{position:relative;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--ac) 14%,transparent),transparent 65%)}
.map svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.top{position:absolute;left:18px;top:14px;right:18px;display:flex;align-items:center;gap:14px;pointer-events:none}
.logo{font-weight:700;font-size:20px;letter-spacing:.2px}
.logo i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--up);margin-right:8px;box-shadow:0 0 0 0 var(--up);animation:pu 2s infinite}
@keyframes pu{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hint{color:var(--mu);font-size:12px}
.top button,.top select{pointer-events:auto}.top #who{margin-left:auto}.top{flex-wrap:wrap}.msel{width:auto;max-width:230px;font-weight:600}
aside{background:var(--pn);border-left:1px solid var(--ln);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
section{padding:16px 18px;border-bottom:1px solid var(--ln)}
h2{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:22px;font-weight:700}
.stat span{font-size:11px;color:var(--mu)}
.dev{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.dev:hover{background:var(--pn2)}.dev.on{background:var(--pn2);border-color:var(--ac)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 8px var(--c)}
.dev div{flex:1;min-width:0}.dev strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--mu)}
.ms{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--c)}
.s-up{--c:var(--up)}.s-warn{--c:var(--wn)}.s-down{--c:var(--dn)}.s-unreach{--c:var(--mu)}.s-pending{--c:var(--mu)}.lk.s-pending{stroke:var(--mu)}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form .w{grid-column:1/-1}
input,select{width:100%;background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:9px;padding:9px 10px;font:inherit;font-size:13px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{background:var(--ac);color:#04101f;border:0;border-radius:9px;padding:9px 14px;font:600 13px Sora,sans-serif;cursor:pointer}
button.g{background:var(--pn2);color:var(--tx);border:1px solid var(--ln)}
button.r{background:transparent;color:var(--dn);border:1px solid var(--dn)}
.err{color:var(--dn);font-size:12px;min-height:16px}
.det h3{margin:0;font-size:17px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kv div{background:var(--pn2);border-radius:9px;padding:7px 9px}.kv b{display:block;font-family:"IBM Plex Mono",monospace;font-size:15px}.kv span{font-size:11px;color:var(--mu)}
.row{display:flex;gap:8px;margin-top:10px}
.log{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--mu);display:grid;gap:5px}
.log b{color:var(--c);font-weight:500}
.zc{position:absolute;right:16px;bottom:16px;display:flex;gap:6px;align-items:center;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:6px}
.zc button{padding:7px 11px}.zc span{min-width:50px;text-align:center;font:12px "IBM Plex Mono",monospace;color:var(--mu)}
.mini{display:none;position:absolute;left:18px;bottom:16px;gap:16px;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:9px 14px;font-size:13px}
.mini span{display:flex;align-items:center;gap:7px}
.app.col{grid-template-columns:1fr;grid-template-rows:100vh}.app.col aside{display:none}.app.col .mini{display:flex}
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.ov[hidden]{display:none}
#lg{background:radial-gradient(ellipse at 50% 35%,color-mix(in srgb,var(--ac) 22%,transparent),transparent 60%),linear-gradient(var(--grid) 1px,transparent 1px) 0 0/50px 50px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/50px 50px,var(--bg)}
#um,#em{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(6px)}
.card{width:100%;max-width:380px;background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.card.wide{max-width:480px;max-height:90vh;overflow-y:auto}
.card .logo{font-size:26px}.card p{margin:0 0 6px;color:var(--mu)}
body:not(.admin) .adm{display:none}
/* mapa */
.gridl{stroke:var(--grid);stroke-width:1}
.lk{stroke:var(--up);stroke-width:2;fill:none;opacity:.85}
.lk.up{stroke-dasharray:6 7;animation:fl 1.1s linear infinite}
.lk.s-warn{stroke:var(--wn)}.lk.s-down,.lk.s-unreach{stroke:var(--dn);opacity:.45;stroke-dasharray:3 6;animation:none}
.lk.s-unreach{stroke:var(--mu)}
@keyframes fl{to{stroke-dashoffset:-13}}
.nd{cursor:grab}
.nd .sh{fill:var(--pn);stroke:var(--c);stroke-width:2.5;filter:drop-shadow(0 0 calc(10px*var(--glow)) var(--c))}
.nd.on .sh{stroke-width:4}
.nd .nm{fill:var(--tx);font:600 12px Sora,sans-serif;text-anchor:middle}
.nd .ip{fill:var(--mu);font:11px "IBM Plex Mono",monospace;text-anchor:middle}
.nd .ic{font-size:22px;text-anchor:middle;dominant-baseline:central}
.nd.s-down .sh{animation:al 1s ease-in-out infinite alternate}
@keyframes al{to{stroke-width:5}}
.lat{fill:var(--mu);font:10px "IBM Plex Mono",monospace;text-anchor:middle}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}aside{border-left:0;border-top:1px solid var(--ln)}body{height:auto}}
</style>
</head>
<body>
<div id="lg" class="ov"><form id="lf" class="card"><div class="logo"><i></i>NetPulse</div><p>Entre para acessar o monitoramento da rede.</p><input id="lu" placeholder="Usuário" required autocomplete="username"><input id="lp" type="password" placeholder="Senha" required autocomplete="current-password"><div class="err" id="le"></div><button type="submit">Entrar</button></form></div>
<div id="em" class="ov" hidden><form id="ef" class="card"><h2>Editar equipamento</h2><input id="en" required maxlength="40" placeholder="Nome"><input id="ei" required placeholder="IP (ex.: 192.168.88.50)" inputmode="decimal"><select id="et" aria-label="Tipo"></select><select id="ep" aria-label="Ligado em"></select><div class="err" id="ee"></div><div class="row"><button type="submit">Salvar alterações</button><button class="g" id="ec" type="button">Cancelar</button></div></form></div>
<div id="um" class="ov" hidden><div class="card wide"><h2>Usuários</h2><div id="ul"></div>
<form id="nuf"><input id="nu" placeholder="Novo usuário" required minlength="3" maxlength="32" autocomplete="off"><input id="np" type="password" placeholder="Senha (mín. 6)" required minlength="6" maxlength="72" autocomplete="new-password"><select class="w" id="nr"><option value="viewer">Visualizador (só vê o mapa)</option><option value="admin">Administrador (gerencia tudo)</option></select><div class="err w" id="ne"></div><button class="w" type="submit">Criar usuário</button></form>
<div class="row"><button class="g" id="uc" type="button">Fechar</button></div></div></div>
<div class="app">
 <div class="map">
  <svg id="svg" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa da topologia de rede"></svg>
  <div class="top"><span class="logo"><i></i>NetPulse</span><select id="ms" class="msel" aria-label="Escolher mapa"></select><button class="g adm" id="mn" type="button" title="Criar novo mapa">+ Novo mapa</button><button class="g adm" id="mr" type="button" title="Renomear este mapa">Renomear</button><button class="r adm" id="mx" type="button" title="Excluir este mapa">Excluir mapa</button><button class="g" id="who" type="button" title="Clique para alterar minha senha"></button><button class="g adm" id="ub" type="button">Usuários</button><button class="g" id="lo" type="button">Sair</button><button class="g" id="tp" type="button">Ocultar painel</button><button class="g" id="theme" type="button">Tema</button></div>
  <div class="mini" id="mini"></div>
  <div class="zc"><button class="g" id="zo" type="button" aria-label="Diminuir zoom">−</button><span id="zl">100%</span><button class="g" id="zi" type="button" aria-label="Aumentar zoom">+</button><button class="g" id="zf" type="button">Ajustar</button><button id="zs" type="button">Salvar posição</button></div>
 </div>
 <aside>
  <section><div class="stats">
   <div class="stat"><b id="c-all">0</b><span>Total</span></div>
   <div class="stat s-up"><b id="c-up" style="color:var(--c)">0</b><span>Online</span></div>
   <div class="stat s-warn"><b id="c-warn" style="color:var(--c)">0</b><span>Lentos</span></div>
   <div class="stat s-down"><b id="c-down" style="color:var(--c)">0</b><span>Offline</span></div>
  </div></section>
  <section class="det" id="det"></section>
  <section><h2>Mapas</h2><div id="ml"></div></section>
  <section><h2>Equipamentos</h2><div id="list"></div></section>
  <section class="adm"><h2>Cadastrar IP</h2>
   <form id="f" autocomplete="off">
    <input class="w" id="fn" placeholder="Nome (ex.: Servidor de arquivos)" required maxlength="28">
    <input id="fi" placeholder="192.168.88.50" required inputmode="decimal">
    <select id="ft"></select>
    <select class="w" id="fp"></select>
    <div class="err w" id="fe"></div>
    <button class="w" type="submit">Adicionar ao mapa</button>
   </form></section>
  <section class="adm"><h2>Importar / exportar</h2><div class="row" style="flex-wrap:wrap;margin-top:0"><button class="g" id="jx" type="button">Baixar exemplo JSON</button><button class="g" id="je" type="button">Exportar tudo</button><button id="ji" type="button">Importar JSON</button></div><input type="file" id="jf" accept=".json,application/json" hidden><div id="jm" style="margin-top:10px;white-space:pre-wrap;color:var(--mu);font-size:12px"></div></section>
  <section><h2>Eventos</h2><div class="log" id="log"></div></section>
 </aside>
</div>
<script>
const $=s=>document.querySelector(s);
const TYPEL={server:['Servidor','🖥️'],router:['Roteador','🌐'],switch:['Switch','🔀'],olt:['OLT','📶'],dvr:['DVR','📼'],retificadora:['Retificadora','🔋'],regua:['Régua volt','🔌'],ap:['Access point','📡'],camera:['Câmera','📷'],totem:['Totem de segurança','🛡️'],pc:['Computador','💻']};
const ICON=Object.fromEntries(Object.entries(TYPEL).map(([k,v])=>[k,v[1]]));
{const o=Object.entries(TYPEL).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');$('#ft').innerHTML=o;$('#et').innerHTML=o}
const LBL={up:'Online',warn:'Lento',down:'Offline',unreach:'Sem rota',pending:'Verificando'};
let devs=[],maps=[],mapId=null,sel=null,events=[],drag=null,me=null,token=null,timer;
try{token=localStorage.getItem('np_token');mapId=+localStorage.getItem('np_map')||null}catch(e){}
const isAdmin=()=>me&&me.role==='admin';
async function api(p,o={}){
 const r=await fetch('/api'+p,{method:o.method||'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:o.body?JSON.stringify(o.body):undefined});
 const j=await r.json().catch(()=>({}));
 if(r.status===401&&token&&p!=='/login'){logout();throw new Error('Sessão expirada')}
 if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:'Verifique os dados informados.');
 return j}
function save(){if(drag&&drag.d&&isAdmin())api('/devices/'+drag.d.id,{method:'PUT',body:{x:Math.round(drag.d.x),y:Math.round(drag.d.y)}}).catch(()=>{})}
async function poll(){if(drag||pan||!token)return;try{
 maps=await api('/maps');if(!maps.some(m=>m.id===mapId))mapId=maps.length?maps[0].id:null;
 const mid=mapId,s=await api('/state?map_id='+mid);if(mid!==mapId)return;
 devs=s.devices;events=s.events.map(e=>({t:new Date(e.ts).toLocaleTimeString('pt-BR'),n:e.name,st:e.status}));render()}catch(e){}}
function loadView(){let v=null;try{v=JSON.parse(localStorage.getItem('np2v_'+mapId))}catch(e){}
 if(v&&v.w>0){view=v;applyView()}else{view={x:0,y:0,w:1000};applyView();fit()}}
async function useMap(id){mapId=id;try{localStorage.setItem('np_map',id)}catch(e){}sel=null;devs=[];events=[];await poll();loadView()}
function renderMaps(){
 const ms=$('#ms'),k=maps.map(m=>m.id+m.name).join('|');
 if(ms.dataset.k!==k){ms.dataset.k=k;ms.innerHTML=maps.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}
 if(mapId!=null)ms.value=mapId;
 $('#ml').innerHTML=maps.map(m=>`<div class="dev ${m.id===mapId?'on':''}" data-map="${m.id}"><div><strong>${esc(m.name)}</strong><span class="mono">${m.total} equipamento${m.total===1?'':'s'}</span></div><span class="mono ${m.down?'s-down':m.warn?'s-warn':'s-up'}" style="color:var(--c)">${m.total?(m.down?m.down+' offline':m.warn?m.warn+' lento(s)':'tudo ok'):'vazio'}</span></div>`).join('')}
$('#ms').addEventListener('change',e=>useMap(+e.target.value));
function logout(){token=null;me=null;try{localStorage.removeItem('np_token')}catch(e){}clearInterval(timer);document.body.classList.remove('admin');$('#um').hidden=true;$('#em').hidden=true;$('#lg').hidden=false}
async function start(){
 $('#lg').hidden=true;document.body.classList.toggle('admin',isAdmin());$('#who').textContent='👤 '+me.username;
 await poll();loadView();
 clearInterval(timer);timer=setInterval(poll,3000)}
async function boot(){if(!token)return;try{me=await api('/me');start()}catch(e){}}
async function loadUsers(){const us=await api('/users');
 $('#ul').innerHTML=us.map(u=>`<div class="dev"><div><strong>${esc(u.username)}</strong><span class="mono">${u.role==='admin'?'Administrador':'Visualizador'}</span></div><button class="g" data-pw="${u.id}">Trocar senha</button>${u.id===me.id?'':`<button class="r" data-du="${u.id}">Excluir</button>`}</div>`).join('')}
function shape(d){
 if(d.type==='router'){const r=34,p=[0,1,2,3,4,5].map(i=>[r*Math.cos(i*Math.PI/3+Math.PI/6),r*Math.sin(i*Math.PI/3+Math.PI/6)].map(v=>v.toFixed(1)).join(',')).join(' ');return`<polygon class="sh" points="${p}"/>`}
 if(['switch','server','dvr','olt','retificadora','regua'].includes(d.type))return`<rect class="sh" x="-30" y="-26" width="60" height="52" rx="12"/>`;
 return`<circle class="sh" r="29"/>`;
}
function spark(d){
 const h=d.hist,w=300,ht=44;if(h.length<2)return'';
 let s='',pen=false;h.forEach((v,i)=>{const x=i*w/39,y=v==null?ht:ht-Math.min(v,120)/120*ht;s+=(i&&pen?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';pen=true});
 return`<svg viewBox="0 0 ${w} ${ht}" width="100%" height="48" preserveAspectRatio="none"><path d="${s}" fill="none" stroke="var(--c)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function render(){
 const by=Object.fromEntries(devs.map(d=>[d.id,d]));
 let g='';
 g+=`<defs><pattern id="gp" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="var(--grid)"/></pattern></defs><rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#gp)" opacity=".6"/>`;


 devs.forEach(d=>{const p=by[d.parent];if(!p)return;
  g+=`<line class="lk s-${d.st} ${d.st==='up'?'up':''}" x1="${p.x}" y1="${p.y}" x2="${d.x}" y2="${d.y}"/>`;
  if(d.lat!=null)g+=`<text class="lat" x="${(p.x+d.x)/2}" y="${(p.y+d.y)/2-7}">${d.lat.toFixed(0)} ms</text>`});
 devs.forEach(d=>{
  g+=`<g class="nd s-${d.st} ${sel===d.id?'on':''}" data-id="${d.id}" transform="translate(${d.x},${d.y})">${shape(d)}<text class="ic">${ICON[d.type]}</text><text class="nm" y="52">${esc(d.name)}</text><text class="ip" y="67">${d.ip}</text></g>`});
 if(!devs.length){const c=vc();g+=`<text class="ip" x="${c.x}" y="${c.y}" style="font-size:16px">${isAdmin()?'Mapa vazio — cadastre um IP no painel lateral':'Nenhum equipamento neste mapa'}</text>`}
 $('#svg').innerHTML=g;
 $('#c-all').textContent=devs.length;
 $('#c-up').textContent=devs.filter(d=>d.st==='up').length;
 $('#c-warn').textContent=devs.filter(d=>d.st==='warn').length;
 $('#c-down').textContent=devs.filter(d=>d.st==='down'||d.st==='unreach').length;
 $('#mini').innerHTML=`<span><i class="dot" style="--c:var(--up)"></i>${$('#c-up').textContent} online</span><span><i class="dot" style="--c:var(--wn)"></i>${$('#c-warn').textContent} lentos</span><span><i class="dot" style="--c:var(--dn)"></i>${$('#c-down').textContent} offline</span>`;
 renderMaps();$('#list').innerHTML=devs.map(d=>`<div class="dev s-${d.st} ${sel===d.id?'on':''}" data-pick="${d.id}"><span class="dot"></span><div><strong>${esc(d.name)}</strong><span class="mono">${d.ip}</span></div><span class="ms">${d.lat!=null?d.lat.toFixed(0)+' ms':LBL[d.st]}</span></div>`).join('');
 const s=by[sel];
 $('#det').innerHTML=s?`<div class="s-${s.st}"><h2>Detalhes</h2><h3>${esc(s.name)}</h3><span class="mono">${s.ip} · ${LBL[s.st]}</span>
  <div class="kv"><div><b>${s.lat!=null?s.lat.toFixed(1):'—'}</b><span>Latência (ms)</span></div><div><b>${s.n?(s.u/s.n*100).toFixed(1):'100'}%</b><span>Disponibilidade</span></div><div><b>${s.n}</b><span>Verificações</span></div></div>
  ${spark(s)}
  ${isAdmin()?'<div class="row"><button id="be" type="button">Editar</button><button class="g" id="bd" type="button">Remover</button></div>':''}</div>`
  :`<h2>Detalhes</h2><span class="hint" style="color:var(--mu)">Selecione um equipamento no mapa ou na lista para ver latência e histórico.</span>`;
 $('#log').innerHTML=events.length?events.map(e=>`<div class="s-${e.st}">${e.t} <b>${esc(e.n)}</b> ${e.st==='down'?'ficou offline':e.st==='up'?'voltou a responder':'sem rota (equipamento pai offline)'}</div>`).join(''):'<div>Nenhum evento ainda.</div>';
 const fp=$('#fp'),k=devs.map(d=>d.id+d.name).join('|');if(fp.dataset.k!==k){const v=fp.value;fp.dataset.k=k;fp.innerHTML='<option value="0">Sem ligação (equipamento isolado)</option>'+devs.map(d=>`<option value="${d.id}">Ligado em: ${esc(d.name)}</option>`).join('');if(v)fp.value=v}
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const svg=$('#svg'),app=$('.app');
let view={x:0,y:0,w:1000},pan=null;

function saveView(){try{localStorage.setItem('np2v_'+mapId,JSON.stringify(view))}catch(e){}}
function applyView(){const r=svg.getBoundingClientRect();if(!r.width)return;svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.w*r.height/r.width}`);$('#zl').textContent=Math.round(1000/view.w*100)+'%'}
function vc(){const r=svg.getBoundingClientRect();return{x:view.x+view.w/2,y:view.y+view.w*r.height/r.width/2}}
function zoomAt(f,cx,cy){const w=Math.max(150,Math.min(12000,view.w/f)),s=w/view.w;view.x=cx-(cx-view.x)*s;view.y=cy-(cy-view.y)*s;view.w=w;applyView();saveView()}
function fit(){const r=svg.getBoundingClientRect(),xs=devs.map(d=>d.x),ys=devs.map(d=>d.y);if(!xs.length)return;const x0=Math.min(...xs)-110,x1=Math.max(...xs)+110,y0=Math.min(...ys)-120,y1=Math.max(...ys)+130,w=Math.max(x1-x0,(y1-y0)*r.width/r.height,200),h=w*r.height/r.width;view={x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2,w};applyView();saveView()}
svg.addEventListener('wheel',e=>{e.preventDefault();const p=pt(e);zoomAt(e.deltaY<0?1.15:1/1.15,p.x,p.y)},{passive:false});
$('#zi').onclick=()=>{const c=vc();zoomAt(1.3,c.x,c.y)};
$('#zo').onclick=()=>{const c=vc();zoomAt(1/1.3,c.x,c.y)};
$('#zf').onclick=fit;
$('#zs').onclick=()=>{saveView();save();const b=$('#zs');b.textContent='Posição salva';setTimeout(()=>b.textContent='Salvar posição',1600)};
function setPanel(c){app.classList.toggle('col',c);$('#tp').textContent=c?'Mostrar painel':'Ocultar painel';try{localStorage.setItem('np2c',c?'1':'0')}catch(e){}}
$('#tp').onclick=()=>setPanel(!app.classList.contains('col'));
function pt(e){const m=svg.getScreenCTM().inverse(),p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m);return p}
svg.addEventListener('pointerdown',e=>{const n=e.target.closest('[data-id]');if(!n){pan={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,moved:false};svg.setPointerCapture(e.pointerId);return}
 const d=devs.find(x=>x.id==n.dataset.id);sel=d.id;const p=pt(e);drag={d,dx:p.x-d.x,dy:p.y-d.y,moved:false};svg.setPointerCapture(e.pointerId);render()});
svg.addEventListener('pointermove',e=>{if(pan){const r=svg.getBoundingClientRect(),k=view.w/r.width,dx=e.clientX-pan.sx,dy=e.clientY-pan.sy;if(Math.abs(dx)+Math.abs(dy)>3)pan.moved=true;view.x=pan.vx-dx*k;view.y=pan.vy-dy*k;applyView();return}if(!drag)return;const p=pt(e);drag.d.x=p.x-drag.dx;drag.d.y=p.y-drag.dy;drag.moved=true;render()});
svg.addEventListener('pointerup',()=>{if(pan){if(!pan.moved){sel=null;render()}else saveView();pan=null}if(drag&&drag.moved)save();drag=null});
const EXAMPLE={_ajuda:'name = nome (até 40 caracteres) | ip = IPv4 | type = server, router, switch, olt, dvr, retificadora, regua, ap, camera, totem, pc | parent = IP do equipamento pai no mesmo mapa (ou null) | x e y são opcionais: sem eles o mapa é organizado automaticamente. IPs que já existem no mapa são ignorados.',version:1,maps:[
{name:'Matriz',devices:[
{name:'Gateway',ip:'192.168.10.1',type:'router',parent:null,x:500,y:300},
{name:'Switch core',ip:'192.168.10.2',type:'switch',parent:'192.168.10.1',x:500,y:140},
{name:'OLT principal',ip:'192.168.10.3',type:'olt',parent:'192.168.10.2'},
{name:'DVR portaria',ip:'192.168.10.20',type:'dvr',parent:'192.168.10.2'},
{name:'Retificadora 48V',ip:'192.168.10.30',type:'retificadora',parent:'192.168.10.1'},
{name:'Régua volt rack 1',ip:'192.168.10.31',type:'regua',parent:'192.168.10.1'},
{name:'Totem de segurança',ip:'192.168.10.40',type:'totem',parent:'192.168.10.2'}]},
{name:'Filial',devices:[
{name:'Roteador filial',ip:'10.20.0.1',type:'router',parent:null},
{name:'Câmera entrada',ip:'10.20.0.10',type:'camera',parent:'10.20.0.1'}]}]};
function dl(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
$('#jf').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const m=$('#jm');m.textContent='Importando…';
 try{let j=JSON.parse(await f.text());if(Array.isArray(j))j={devices:j};if(!j||typeof j!=='object')throw new SyntaxError();if(!j.maps)j.map_id=mapId;
  const r=await api('/import',{method:'POST',body:j});
  m.textContent=`Importação concluída: ${r.added} adicionado(s), ${r.skipped} já existente(s)`+(r.maps_created?`, ${r.maps_created} mapa(s) criado(s)`:'')+(r.error_count?'\nAvisos:\n'+r.errors.slice(0,6).join('\n')+(r.error_count>6?`\n… e mais ${r.error_count-6}`:''):'');
  await poll();if(r.added)fit()}
 catch(x){m.textContent='Erro: '+(x instanceof SyntaxError?'arquivo JSON inválido.':x.message)}});
function openEdit(){const d=devs.find(x=>x.id===sel);if(!d)return;
 const bad=new Set([d.id]);let ch=true;while(ch){ch=false;devs.forEach(x=>{if(!bad.has(x.id)&&bad.has(x.parent)){bad.add(x.id);ch=true}})}
 $('#ef').dataset.id=d.id;$('#en').value=d.name;$('#ei').value=d.ip;$('#et').value=d.type;
 $('#ep').innerHTML='<option value="0">Sem ligação (equipamento isolado)</option>'+devs.filter(x=>!bad.has(x.id)).map(x=>`<option value="${x.id}">Ligado em: ${esc(x.name)}</option>`).join('');
 $('#ep').value=d.parent;$('#ee').textContent='';$('#em').hidden=false}
$('#ef').addEventListener('submit',async e=>{e.preventDefault();$('#ee').textContent='';
 try{await api('/devices/'+e.target.dataset.id,{method:'PUT',body:{name:$('#en').value.trim(),ip:$('#ei').value.trim(),type:$('#et').value,parent:+$('#ep').value}});$('#em').hidden=true;await poll()}
 catch(x){$('#ee').textContent=x.message}});
document.addEventListener('click',async e=>{
 const t=e.target,pk=t.closest('[data-pick]'),mp=t.closest('[data-map]');
 if(mp){useMap(+mp.dataset.map);return}
 if(pk){sel=+pk.dataset.pick;render();return}
 try{
  if(t.id==='bd'&&confirm('Remover este equipamento do monitoramento?')){await api('/devices/'+sel,{method:'DELETE'});sel=null;await poll()}
  if(t.id==='lo')logout();
  if(t.id==='be')openEdit();
  if(t.id==='jx')dl('netpulse-exemplo.json',EXAMPLE);
  if(t.id==='je')dl('netpulse-equipamentos-'+new Date().toISOString().slice(0,10)+'.json',await api('/export'));
  if(t.id==='ji')$('#jf').click();
  if(t.id==='ec')$('#em').hidden=true;
  if(t.id==='mn'){const nm=prompt('Nome do novo mapa:');if(nm&&nm.trim()){const r=await api('/maps',{method:'POST',body:{name:nm.trim()}});await useMap(r.id)}}
  if(t.id==='mr'){const cur=maps.find(m=>m.id===mapId),nm=prompt('Novo nome do mapa:',cur?cur.name:'');if(nm&&nm.trim()){await api('/maps/'+mapId,{method:'PUT',body:{name:nm.trim()}});await poll()}}
  if(t.id==='mx'){const cur=maps.find(m=>m.id===mapId);if(cur&&confirm('Excluir o mapa "'+cur.name+'" e todos os equipamentos dele?')){await api('/maps/'+mapId,{method:'DELETE'});mapId=null;sel=null;await poll();loadView()}}
  if(t.id==='ub'){$('#um').hidden=false;loadUsers()}
  if(t.id==='uc')$('#um').hidden=true;
  if(t.dataset.pw){const w=prompt('Nova senha (mínimo 6 caracteres):');if(w){await api('/users/'+t.dataset.pw+'/password',{method:'PUT',body:{password:w}});alert('Senha alterada.')}}
  if(t.dataset.du&&confirm('Excluir este usuário?')){await api('/users/'+t.dataset.du,{method:'DELETE'});loadUsers()}
  if(t.id==='who'){const w=prompt('Nova senha para '+me.username+' (mínimo 6 caracteres):');if(w){await api('/me/password',{method:'PUT',body:{password:w}});alert('Senha alterada.')}}
 }catch(x){alert(x.message)}
});
$('#lf').addEventListener('submit',async e=>{e.preventDefault();$('#le').textContent='';
 try{const r=await api('/login',{method:'POST',body:{username:$('#lu').value.trim(),password:$('#lp').value}});token=r.token;me=r.user;try{localStorage.setItem('np_token',token)}catch(x){}$('#lp').value='';start()}
 catch(x){$('#le').textContent=x.message}});
$('#nuf').addEventListener('submit',async e=>{e.preventDefault();$('#ne').textContent='';
 try{await api('/users',{method:'POST',body:{username:$('#nu').value.trim(),password:$('#np').value,role:$('#nr').value}});e.target.reset();loadUsers()}
 catch(x){$('#ne').textContent=x.message}});
$('#f').addEventListener('submit',async e=>{e.preventDefault();$('#fe').textContent='';
 const par=+$('#fp').value,pp=devs.find(d=>d.id===par),a=Math.random()*Math.PI*2,c=vc();
 try{const r=await api('/devices',{method:'POST',body:{name:$('#fn').value.trim(),ip:$('#fi').value.trim(),type:$('#ft').value,parent:par,map_id:mapId,x:Math.round((pp?pp.x:c.x)+Math.cos(a)*170),y:Math.round((pp?pp.y:c.y)+Math.sin(a)*140)}});sel=r.id;e.target.reset();await poll()}
 catch(x){$('#fe').textContent=x.message}});
$('#theme').addEventListener('click',()=>{const r=document.documentElement,dk=getComputedStyle(r).colorScheme==='dark';r.dataset.theme=dk?'light':'dark'});
try{if(localStorage.getItem('np2c')==='1')setPanel(true)}catch(e){}
new ResizeObserver(applyView).observe($('.map'));
applyView();render();boot();
</script>
<script>
/* Favicon animado: ponto verde pulsando devagar, como um ping */
(function(){
 var c=document.createElement('canvas');c.width=c.height=32;var x=c.getContext('2d');
 var l=document.querySelector('link[rel="icon"]'),P=2400;
 if(!x||!l)return;
 function draw(t){
  var p=(t%P)/P,a=.45+.55*(.5+.5*Math.cos(p*2*Math.PI));
  x.clearRect(0,0,32,32);
  x.beginPath();x.arc(16,16,9+p*7,0,7);x.strokeStyle='rgba(31,214,138,'+(.7*(1-p))+')';x.lineWidth=2.5;x.stroke();
  x.beginPath();x.arc(16,16,8,0,7);x.fillStyle='rgba(31,214,138,'+a+')';x.fill();
  l.type='image/png';l.href=c.toDataURL('image/png');
 }
 draw(0);setInterval(function(){draw(Date.now())},150);
})();
</script>
